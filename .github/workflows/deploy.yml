name: Deploy Bun TS Project to GitHub Pages

on:
  push:
    branches: ["main"] # Change to your default branch if it's master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Runs your custom TS compilation script
      - name: Compile TypeScript
        run: bun run build-ts || bun build.ts

      # Configures the GitHub Pages environment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Uploads the static folder. Based on your local server command, 
      # your built assets live inside the './public' directory.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      # Deploys the uploaded artifact to Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
