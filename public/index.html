<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mii Creator</title>

    <meta property="og:title" content="Mii Creator - Web-based Mii editor" />
    <meta
      property="og:description"
      content="Create and share Mii characters online with just a few clicks!"
    />
    <meta
      name="description"
      content="Create and share Mii characters online with just a few clicks!"
    />
    <meta
      name="keywords"
      content="Mii, Mii Creator, Nintendo, Pretendo, FFL, Wii U, 3DS, Mii Maker, Web Mii Maker"
    />
    <meta property="theme-color" content="#484848" />
    <meta property="og:site_name" content="mii.nxw.pw" />
    <meta property="og:image" content="https://mii.nxw.pw/assets/images/preview_dark.png" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:image" content="https://mii.nxw.pw/assets/images/preview_dark.png" />

    <style>
      html,
      body {
        background-color: white !important;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: black !important;
        }
      }

      #musicBtn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 9999;
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background: #484848;
        color: white;
        font-size: 14px;
      }
    </style>

    <link rel="stylesheet" href="dist/main.css" />
  </head>

  <body>
    <!-- Music Button -->
    <button id="musicBtn">🔇 Music Off</button>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
      <source src="assets/music.mp3" type="audio/mpeg" />
    </audio>

    <script>
      const global = {};
      const process = { env: { NODE_DEBUG: false } };

      const musicBtn = document.getElementById("musicBtn");
      const bgMusic = document.getElementById("bgMusic");

      let isPlaying = false;

      musicBtn.addEventListener("click", async () => {
        if (!isPlaying) {
          await bgMusic.play();
          musicBtn.textContent = "🔊 Music On";
        } else {
          bgMusic.pause();
          musicBtn.textContent = "🔇 Music Off";
        }
        isPlaying = !isPlaying;
      });
    </script>

    <script type="module" src="dist/main.js"></script>
  </body>
</html>
